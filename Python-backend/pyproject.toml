[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butang-backend"
version = "0.1.0"
description = "不糖酱桌宠知识库与文档处理后端骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.18,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0"]

[project.scripts]
butang-backend = "app.main:run"

[tool.setuptools.packages.find]
where = ["src"]
